<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#EEF2F6;--card:#fff;--ink:#14263A;--mut:#5B6B7C;--line:#D5DDE6;--acc:#1769E0;--pos:#12805A;--neg:#C73A33;--bb:#E1E8EF;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--acc:#4C9AFF;--bg:#0F1B28;--card:#172636;--ink:#EAF0F6;--mut:#9AABBC;--line:#27394B;--pos:#3CC98F;--neg:#FF7A70;--bb:#223446;color-scheme:dark}}
:root[data-theme="dark"]{--acc:#4C9AFF;--bg:#0F1B28;--card:#172636;--ink:#EAF0F6;--mut:#9AABBC;--line:#27394B;--pos:#3CC98F;--neg:#FF7A70;--bb:#223446;color-scheme:dark}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{font:16px/1.4 Barlow,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
header{background:#033078;color:#fff;padding:8px 18px 12px;text-align:center}
header img{display:block;margin:0 auto;width:150px;max-width:50vw;height:auto}
header p{font:600 19px 'Barlow Condensed',sans-serif}
.sr{position:absolute;left:-9999px}
.wm{text-align:center;font-size:12px;color:var(--mut);padding:2px 0 10px}
main{max-width:480px;margin:0 auto;padding:14px;display:grid;gap:12px}
.card,.hero{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
.hero{border-radius:16px;padding:18px;border-top:5px solid var(--acc)}
.lbl,.mut,small{color:var(--mut)}
small{font-size:13px;display:block}
.mut{font-size:14px}
.big{font:700 58px/1 'Barlow Condensed',sans-serif}
.pos{color:var(--pos)}.neg{color:var(--neg)}
h2{font:600 21px 'Barlow Condensed',sans-serif}
.row,.row2{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.row2{border:0;padding:0}
.cmp{display:grid;gap:6px}
.cmp>div:not(.bar){display:flex;justify-content:space-between}
.bar{height:14px;background:var(--bb);border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%}
input,select{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input.sm{width:120px;text-align:right}
.date{width:auto}
.seg-b{font:600 17px 'Barlow Condensed',sans-serif;background:var(--ink);color:var(--card);border:0;border-radius:8px;padding:10px 14px}
label{display:grid;gap:4px;color:var(--mut);font-size:14px}
.cta{font:700 21px 'Barlow Condensed',sans-serif;background:#1769E0;color:#fff;border:0;border-radius:8px;padding:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:600 19px 'Barlow Condensed',sans-serif}
.seg .on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.x{border:0;background:none;color:var(--mut);font-size:26px;width:36px;height:36px}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{border:0;border-top:4px solid transparent;background:none;color:var(--mut);padding:8px 2px;min-height:58px;font:600 17px/1.1 'Barlow Condensed',sans-serif}
nav .on{color:var(--ink);border-top-color:var(--acc)}
.mc{display:flex;gap:10px;height:130px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.pair{flex:1;width:100%;display:flex;align-items:flex-end;gap:3px}
.pair i{flex:1;border-radius:3px 3px 0 0;min-height:2px}
.grid{display:grid;grid-template-columns:1fr auto;gap:4px 10px}
.grid span{color:var(--mut)}.grid b{text-align:right}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>

<button data-t="hoje" onclick="setTab('hoje')">Hoje</button>

<script>
const $=s=>document.querySelector(s);
const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)&&n>0?n:0};
const dim=d=>new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
const VAR=['Gasolina','Troca de óleo','Manutenção','Alimentação','Lava rápido','Outro'];
const PLAT=['iFood','Rappi','Uber','99','Outro'];
let S={entries:[],fixed:[{id:1,name:'Parcela do veículo',val:0},{id:2,name:'Seguro do veículo',val:0},{id:3,name:'Internet',val:0}],goals:{d:0,w:0,m:0}};
try{const r=localStorage.getItem('sobra-v1');if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem('sobra-v1',JSON.stringify(S))}catch(e){}};
let D=iso(new Date()),T='hoje',K='ganho';
const fixedTotal=()=>S.fixed.reduce((a,f)=>a+f.val,0);
const sum=(l,t)=>l.filter(e=>e.type===t).reduce((a,e)=>a+e.val,0);
function dayStats(ds){const l=S.entries.filter(e=>e.date===ds);const g=sum(l,'ganho'),v=sum(l,'gasto'),f=fixedTotal()/dim(parse(ds));return{l,g,v,f,p:g-v-f}}

function vHoje(){
const s=dayStats(D),mx=Math.max(s.g,s.v,1);
return `<div class="row2"><input type="date" class="date" value="${D}" max="${iso(new Date())}" onchange="D=this.value||D;render()" aria-label="Data">${D!==iso(new Date())?'<button class="seg-b" onclick="D=iso(new Date());render()">Voltar para hoje</button>':''}</div>
<section class="hero"><p class="lbl">Lucro real ${D===iso(new Date())?'de hoje':'do dia'} (${parse(D).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})})</p><div class="big ${s.g-s.v<0?'neg':'pos'}">${brl(s.g-s.v)}</div>
<div class="cmp"><div><span>Ganhos</span><b>${brl(s.g)}</b></div><div class="bar"><i style="width:${s.g/mx*100}%;background:var(--pos)"></i></div>
<div><span>Gastos</span><b>${brl(s.v)}</b></div><div class="bar"><i style="width:${s.v/mx*100}%;background:var(--neg)"></i></div></div>
<p class="mut">Lucro = ganhos − gastos variáveis. Os gastos fixos entram na Análise semanal.</p></section>
<section class="card"><div class="seg"><button class="${K=='ganho'?'on':''}" onclick="K='ganho';render()">Ganho</button><button class="${K=='gasto'?'on':''}" onclick="K='gasto';render()">Gasto</button></div>
<select id="cat" aria-label="Categoria">${(K=='ganho'?PLAT:VAR).map(c=>`<option>${c}</option>`).join('')}</select>
<input id="val" inputmode="decimal" placeholder="Valor (R$)" aria-label="Valor">
<button class="cta" onclick="addEntry()">Salvar ${K}</button></section>
<section class="card"><h2>Lançamentos do dia</h2>${s.l.length?s.l.map(e=>`<div class="row"><span>${esc(e.cat)}<small>${e.type}</small></span><b class="${e.type=='ganho'?'pos':'neg'}">${e.type=='ganho'?'+':'−'}${brl(e.val)}</b><button class="x" onclick="delEntry(${e.id})" aria-label="Apagar lançamento">×</button></div>`).join(''):'<p class="mut">Nenhum lançamento '+(D===iso(new Date())?'hoje':'neste dia')+'. Salve o primeiro ganho ou gasto acima.</p>'}</section>`}

function vFixos(){
const t=fixedTotal();
return `<section class="hero"><p class="lbl">Gastos fixos por mês</p><div class="big">${brl(t)}</div><p class="mut">Dá ${brl(t/dim(new Date()))} por dia. Aparece na Análise semanal e na aba Meses.</p></section>
<section class="card"><h2>Seus gastos fixos</h2>${S.fixed.map(f=>`<div class="row"><span>${esc(f.name)}</span><input class="sm" inputmode="decimal" value="${f.val}" onchange="setFixed(${f.id},this.value)" aria-label="Valor mensal de ${esc(f.name)}"><button class="x" onclick="delFixed(${f.id})" aria-label="Remover">×</button></div>`).join('')}</section>
<section class="card"><h2>Novo gasto fixo</h2><input id="fn" placeholder="Nome (ex.: aluguel da moto)"><input id="fv" inputmode="decimal" placeholder="Valor por mês (R$)"><button class="cta" onclick="addFixed()">Adicionar gasto fixo</button></section>`}

function prog(label,got,goal){
const r=Math.max(goal-got,0),pc=goal?Math.min(got/goal*100,100):0;
return `<section class="card"><div class="row2"><h2>${label}</h2><b>${brl(got)} / ${goal?brl(goal):'—'}</b></div><div class="bar"><i style="width:${pc}%;background:var(--acc)"></i></div><p class="${goal&&!r?'pos':'mut'}">${!goal?'Defina esta meta abaixo.':r?`Faltam ${brl(r)}`:'Meta batida!'}</p></section>`}
function vMetas(){
const d=parse(D),mon=new Date(d);mon.setDate(d.getDate()-(d.getDay()+6)%7);
const sun=new Date(mon);sun.setDate(mon.getDate()+6);
const g=(a,b)=>S.entries.filter(e=>e.type=='ganho'&&e.date>=a&&e.date<=b).reduce((s,e)=>s+e.val,0);
const m=D.slice(0,7);
return `<p class="mut">Metas em ganho bruto, calculadas para o dia escolhido em Hoje e para a semana e o mês dele.</p>`+prog('Meta do dia',g(D,D),S.goals.d)+prog('Meta da semana',g(iso(mon),iso(sun)),S.goals.w)+prog('Meta do mês',g(m+'-01',m+'-31'),S.goals.m)+
`<section class="card"><h2>Definir metas</h2>`+[['d','Por dia (R$)'],['w','Por semana (R$)'],['m','Por mês (R$)']].map(([k,l])=>`<label>${l}<input inputmode="decimal" value="${S.goals[k]||''}" placeholder="0,00" onchange="setGoal('${k}',this.value)"></label>`).join('')+`</section>`}

function months(){
const ks=new Set(S.entries.map(e=>e.date.slice(0,7)));ks.add(iso(new Date()).slice(0,7));
return [...ks].sort().map(k=>{const l=S.entries.filter(e=>e.date.startsWith(k));const g=sum(l,'ganho'),v=sum(l,'gasto'),f=fixedTotal();return{k,g,v,f,p:g-v-f}})}
function vMeses(){
const ms=months(),sh=ms.slice(-6),mx=Math.max(...sh.map(m=>Math.max(m.g,m.v+m.f)),1);
const nm=k=>{const[a,b]=k.split('-');return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][b-1]+'/'+a.slice(2)};
return `<section class="card"><h2>Ganhos x gastos por mês</h2><div class="mc">${sh.map(m=>`<div class="col"><div class="pair"><i style="height:${m.g/mx*100}%;background:var(--pos)"></i><i style="height:${(m.v+m.f)/mx*100}%;background:var(--neg)"></i></div><small>${nm(m.k)}</small></div>`).join('')}</div><p class="mut">Verde: ganhos. Vermelho: gastos (variáveis + fixos).</p></section>`+
ms.slice().reverse().map((m,i,a)=>{const pr=a[i+1],d=pr?m.p-pr.p:null;
return `<section class="card"><div class="row2"><h2>${nm(m.k)}</h2><b class="${m.p<0?'neg':'pos'}">${brl(m.p)}</b></div><div class="grid"><span>Ganhos</span><b>${brl(m.g)}</b><span>Gastos variáveis</span><b>${brl(m.v)}</b><span>Gastos fixos</span><b>${brl(m.f)}</b><span>Margem de lucro</span><b>${m.g?Math.round(m.p/m.g*100):0}%</b></div>${d===null?'':`<p class="mut">${d>=0?'+':'−'}${brl(Math.abs(d))} de lucro em relação ao mês anterior</p>`}</section>`}).join('')}

function vSemana(){
const t=new Date(),ds=[];for(let i=6;i>=0;i--){const x=new Date(t);x.setDate(t.getDate()-i);ds.push(iso(x))}
const st=ds.map(s=>({s,...dayStats(s)}));
const g=st.reduce((a,x)=>a+x.g,0),v=st.reduce((a,x)=>a+x.v,0),f=st.reduce((a,x)=>a+x.f,0),p=g-v-f;
const mx=Math.max(...st.map(x=>Math.max(x.g,x.v)),1),wd=['dom','seg','ter','qua','qui','sex','sáb'];
return `<section class="hero"><p class="lbl">Lucro real dos últimos 7 dias</p><div class="big ${p<0?'neg':'pos'}">${brl(p)}</div><div class="grid"><span>Ganhos</span><b>${brl(g)}</b><span>Gastos variáveis</span><b>${brl(v)}</b><span>Gastos fixos</span><b>${brl(f)}</b></div><p class="mut">Fixos da semana = valor mensal rateado por dia. Média de ganhos: ${brl(g/7)} por dia.</p></section>
<section class="card"><h2>Dia a dia</h2><div class="mc">${st.map(x=>`<div class="col"><div class="pair"><i style="height:${x.g/mx*100}%;background:var(--pos)"></i><i style="height:${x.v/mx*100}%;background:var(--neg)"></i></div><small>${wd[parse(x.s).getDay()]}</small></div>`).join('')}</div><p class="mut">Verde: ganhos. Vermelho: gastos variáveis.</p></section>`}
const BK=`<section class="card"><h2>Backup dos dados</h2><p class="mut">Seus dados ficam só neste aparelho. Exporte um backup para guardar ou trocar de celular.</p><button class="cta" onclick="exportBk()">Exportar backup</button><label>Importar backup<input type="file" accept="application/json,.json" onchange="importBk(this.files[0])"></label></section>`;
function exportBk(){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='gastos-motoca-backup-'+iso(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importBk(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.entries)||!Array.isArray(d.fixed)||!d.goals)throw 0;if(confirm('Substituir os dados atuais pelo backup?')){S=d;save();render()}}catch(e){alert('Arquivo de backup inválido.')}};r.readAsText(f)}
function render(){
$('#app').innerHTML={hoje:vHoje,fixos:vFixos,metas:vMetas,semana:vSemana,meses:vMeses}[T]()+(T=='meses'?BK:'');
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===T))}
function setTab(t){T=t;render();window.scrollTo(0,0)}
function addEntry(){const v=num($('#val').value);if(!v){$('#val').focus();return}S.entries.push({id:Date.now(),date:D,type:K,cat:$('#cat').value,val:v});save();render()}
function delEntry(id){S.entries=S.entries.filter(e=>e.id!==id);save();render()}
function setFixed(id,v){S.fixed.find(f=>f.id===id).val=num(v);save();render()}
function delFixed(id){S.fixed=S.fixed.filter(f=>f.id!==id);save();render()}
function addFixed(){const n=$('#fn').value.trim(),v=num($('#fv').value);if(!n){$('#fn').focus();return}S.fixed.push({id:Date.now(),name:n,val:v});save();render()}
function setGoal(k,v){S.goals[k]=num(v);save();render()}
let TODAY=iso(new Date());
function chk(){const n=iso(new Date());if(n!==TODAY){TODAY=n;D=n;render()}}
setInterval(chk,30000);document.addEventListener('visibilitychange',chk);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
